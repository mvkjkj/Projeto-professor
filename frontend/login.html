<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar - EPT TASKS | Portal Escolar</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            position: relative;
        }

        /* =========================
           BOTÃO INÍCIO
        ========================= */

        .btn-voltar-home {

            position: absolute;

            top: 25px;

            left: 25px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 0.9rem;

            font-weight: bold;

            background:
                rgba(255, 255, 255, 0.08);

            padding: 10px 18px;

            border-radius: 8px;

            backdrop-filter: blur(10px);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            transition: 0.3s;

            display: flex;

            align-items: center;

            gap: 8px;
        }

        .btn-voltar-home:hover {

            background:
                rgba(255, 119, 0, 0.2);

            color: #ff9a4d;

            border-color: #ff7700;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-container {

            width: 100%;

            max-width: 420px;
        }

        .login-box {

            background:
                rgba(15, 23, 42, 0.82);

            backdrop-filter: blur(15px);

            padding: 40px 30px;

            border-radius: 20px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.4);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            text-align: center;
        }

        /* =========================
           LOGO
        ========================= */

        .logo-mini {

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 20px;

            color: white;
        }

        .logo-mini span {
            color: #ff7700;
        }

        h2 {

            color: white;

            font-size: 1.6rem;

            margin-bottom: 6px;
        }

        .subtitle {

            color: #cbd5e1;

            font-size: 0.9rem;

            margin-bottom: 25px;
        }

        /* =========================
           PROFESSOR / ALUNO
        ========================= */

        .perfil-seletor {

            display: flex;

            position: relative;

            background:
                rgba(255, 255, 255, 0.08);

            padding: 5px;

            border-radius: 30px;

            margin-bottom: 25px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);
        }

        .perfil-seletor input[type="radio"] {
            display: none;
        }

        .opcao-aba {

            flex: 1;

            padding: 10px 0;

            font-size: 0.9rem;

            font-weight: 600;

            color: #94a3b8;

            cursor: pointer;

            z-index: 2;

            transition: 0.3s;

            user-select: none;
        }

        .slider-bg {

            position: absolute;

            top: 5px;

            left: 5px;

            width: calc(50% - 5px);

            height: calc(100% - 10px);

            background: #ff7700;

            border-radius: 25px;

            box-shadow:
                0 4px 15px
                rgba(255, 119, 0, 0.3);

            transition: 0.3s;

            z-index: 1;
        }

        #radio-professor:checked ~ .slider-bg {
            transform: translateX(0);
        }

        #radio-aluno:checked ~ .slider-bg {
            transform: translateX(100%);
        }

        #radio-professor:checked ~ label[for="radio-professor"],
        #radio-aluno:checked ~ label[for="radio-aluno"] {

            color: white;
        }

        /* =========================
           CAMPOS
        ========================= */

        .input-group {

            text-align: left;

            margin-bottom: 18px;
        }

        label {

            display: block;

            font-size: 0.85rem;

            font-weight: 600;

            color: #e2e8f0;

            margin-bottom: 6px;
        }

        .input-wrapper {

            position: relative;

            display: flex;

            align-items: center;
        }

        .input-icon {

            position: absolute;

            left: 14px;

            color: #94a3b8;

            font-size: 0.95rem;

            pointer-events: none;
        }

        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding:
                12px
                16px
                12px
                42px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            font-size: 0.95rem;

            background:
                rgba(255, 255, 255, 0.05);

            color: white;

            transition: 0.3s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {

            outline: none;

            border-color: #ff7700;

            background:
                rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 0 3px
                rgba(255, 119, 0, 0.25);
        }

        /* =========================
           BOTÃO LOGIN
        ========================= */

        .btn-acessar {

            width: 100%;

            padding: 14px;

            background: #ff7700;

            color: white;

            border: none;

            border-radius: 9px;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(255, 119, 0, 0.25);

            transition: 0.3s;

            margin-top: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }

        .btn-acessar:hover:not(:disabled) {

            background: #e66b00;

            transform: translateY(-2px);
        }

        .btn-acessar:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }

        /* =========================
           ERRO
        ========================= */

        .erro-alerta {

            display: none;

            margin-top: 15px;

            background:
                rgba(239, 68, 68, 0.15);

            color: #f87171;

            padding: 10px;

            border-radius: 8px;

            font-size: 0.85rem;

            border:
                1px solid
                rgba(239, 68, 68, 0.3);
        }

        /* =========================
           RODAPÉ
        ========================= */

        .footer-links {

            margin-top: 20px;

            font-size: 0.88rem;

            color: #94a3b8;
        }

        .footer-links a {

            color: #ff9a4d;

            text-decoration: none;

            font-weight: bold;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           ANIMAÇÃO
        ========================= */

        @keyframes shake {

            0%, 100% {
                transform: translateX(0);
            }

            20%, 60% {
                transform: translateX(-6px);
            }

            40%, 80% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.35s ease-in-out;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 500px) {

            .btn-voltar-home {

                top: 15px;

                left: 15px;

                padding: 8px 12px;

                font-size: 0.8rem;
            }

            .login-box {

                padding:
                    35px
                    20px;
            }

        }

    </style>

</head>

<body>

    <!-- =========================
         VOLTAR PARA INÍCIO
    ========================= -->

    <a
        href="index.html"
        class="btn-voltar-home"
    >

        <i class="fa-solid fa-arrow-left"></i>

        Início

    </a>


    <div class="login-container">

        <div class="login-box">

            <!-- LOGO -->

            <div class="logo-mini">

                EPT
                <span>TASKS</span>
                📋

            </div>


            <h2>
                Bem-vindo de volta
            </h2>

            <p class="subtitle">
                Entre para acessar o Portal Escolar
            </p>


            <!-- =========================
                 PERFIL
            ========================= -->

            <div class="perfil-seletor">

                <input
                    type="radio"
                    id="radio-professor"
                    name="perfil"
                    value="professor"
                    checked
                >

                <label
                    for="radio-professor"
                    class="opcao-aba"
                >
                    👨‍🏫 Professor
                </label>


                <input
                    type="radio"
                    id="radio-aluno"
                    name="perfil"
                    value="aluno"
                >

                <label
                    for="radio-aluno"
                    class="opcao-aba"
                >
                    👨‍🎓 Aluno
                </label>


                <div class="slider-bg"></div>

            </div>


            <!-- =========================
                 FORMULÁRIO
            ========================= -->

            <form id="form-login">

                <div class="input-group">

                    <label
                        id="label-usuario"
                        for="usuario"
                    >
                        E-mail:
                    </label>

                    <div class="input-wrapper">

                        <i
                            class="fa-regular fa-envelope input-icon"
                        ></i>

                        <input
                            type="email"
                            id="usuario"
                            placeholder="seuemail@escola.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha:
                    </label>

                    <div class="input-wrapper">

                        <i
                            class="fa-solid fa-lock input-icon"
                        ></i>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    id="btn-submit"
                    class="btn-acessar"
                >

                    <span>
                        Entrar no Sistema
                    </span>

                    <i
                        class="fa-solid fa-arrow-right-to-bracket"
                    ></i>

                </button>

            </form>


            <!-- ERRO -->

            <div
                id="mensagem-erro"
                class="erro-alerta"
            ></div>


            <!-- CADASTRO -->

            <div class="footer-links">

                <p>

                    Não possui uma conta?

                    <a href="cadastro.html">
                        Criar Conta
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script>

        // =========================
        // ELEMENTOS
        // =========================

        const radioProfessor =
            document.getElementById(
                "radio-professor"
            );

        const radioAluno =
            document.getElementById(
                "radio-aluno"
            );

        const labelUsuario =
            document.getElementById(
                "label-usuario"
            );

        const inputUsuario =
            document.getElementById(
                "usuario"
            );

        const formLogin =
            document.getElementById(
                "form-login"
            );

        const btnSubmit =
            document.getElementById(
                "btn-submit"
            );

        const mensagemErro =
            document.getElementById(
                "mensagem-erro"
            );


        // =========================
        // ALTERAR PERFIL
        // =========================

        function atualizarPerfil() {

            if (radioProfessor.checked) {

                labelUsuario.innerText =
                    "E-mail do Professor:";

                inputUsuario.placeholder =
                    "professor@escola.com";

            } else {

                labelUsuario.innerText =
                    "E-mail do Aluno:";

                inputUsuario.placeholder =
                    "aluno@escola.com";

            }

        }


        radioProfessor.addEventListener(
            "change",
            atualizarPerfil
        );

        radioAluno.addEventListener(
            "change",
            atualizarPerfil
        );


        atualizarPerfil();


        // =========================
        // LOGIN
        // =========================

        formLogin.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                mensagemErro.style.display =
                    "none";


                const email =
                    inputUsuario.value.trim();

                const senha =
                    document
                        .getElementById("senha")
                        .value;


                if (!email || !senha) {

                    mostrarErro(
                        "Preencha seu e-mail e sua senha."
                    );

                    return;
                }


                // DESABILITAR BOTÃO

                const btnTexto =
                    btnSubmit.querySelector(
                        "span"
                    );

                const textoOriginal =
                    btnTexto.innerText;

                btnSubmit.disabled = true;

                btnTexto.innerText =
                    "Autenticando...";


                try {

                    // =========================
                    // ENVIAR LOGIN
                    // =========================

                    const resposta =
                        await fetch(
                            "http://localhost:3000/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    senha: senha

                                })
                            }
                        );


                    const dados =
                        await resposta.json();


                    console.log(
                        "Resposta do login:",
                        dados
                    );


                    // =========================
                    // LOGIN CORRETO
                    // =========================

                    if (resposta.ok) {

                        // SALVAR TOKEN

                        localStorage.setItem(
                            "token",
                            dados.token
                        );

                        localStorage.setItem(
                            "nome",
                            dados.nome
                        );

                        localStorage.setItem(
                            "tipo",
                            dados.tipo
                        );


                        btnTexto.innerText =
                            "Redirecionando...";


                        /*
                         * AQUI ESTAVA O ERRO.
                         *
                         * Antes o professor era enviado
                         * para index.html.
                         *
                         * Agora ele vai para o painel.
                         */

                        if (
                            dados.tipo ===
                            "professor"
                        ) {

                            window.location.href =
                                "dashboard.html";

                        } else {

                            window.location.href =
                                "painel-aluno.html";

                        }

                    } else {

                        mostrarErro(
                            dados.erro ||
                            "E-mail ou senha incorretos."
                        );

                    }

                } catch (erro) {

                    console.error(
                        "Erro no login:",
                        erro
                    );

                    mostrarErro(
                        "Não foi possível conectar ao servidor. Verifique se o npm run dev está rodando."
                    );

                } finally {

                    btnSubmit.disabled = false;

                    btnTexto.innerText =
                        textoOriginal;

                }

            }
        );


        // =========================
        // MOSTRAR ERRO
        // =========================

        function mostrarErro(mensagem) {

            mensagemErro.innerText =
                mensagem;

            mensagemErro.style.display =
                "block";

            mensagemErro.classList.add(
                "shake"
            );

            setTimeout(
                function () {

                    mensagemErro.classList.remove(
                        "shake"
                    );

                },
                400
            );

        }

    </script>

</body>

</html>
