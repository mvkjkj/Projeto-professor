<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#14213d"><title>Área do aluno | EPT TASKS</title>
<style>
:root{--navy:#14213d;--blue:#2457a7;--bg:#f4f6fa;--text:#1e293b;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.top{background:var(--navy);color:white;padding:16px max(20px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:21px;font-weight:900}.brand span{color:#ffad5c}.btn-out{background:#334155;color:#fff}.wrap{max-width:1000px;margin:35px auto;padding:0 20px}.intro{margin-bottom:22px}.intro h1{margin:5px 0;font-size:29px}.muted{color:var(--muted)}.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:20px}.summary strong{font-size:26px;display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.panel h2{margin:0 0 16px;font-size:19px}.task{border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:12px}.task-head{display:flex;justify-content:space-between;gap:12px}.task h3{margin:0 0 6px}.task p{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px;background:#fff4db;color:#9a5b00;white-space:nowrap;height:max-content}.pill.done{background:#dcfce7;color:#166534}.meta{font-size:12px;color:var(--muted)}.btn-done{background:var(--blue);color:white;margin-top:12px}.empty,.loading{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px}@media(max-width:550px){.top{padding:14px}.wrap{padding:0 14px;margin:24px auto}.intro h1{font-size:24px}.panel{padding:16px}.task-head{flex-direction:column}}
</style></head><body>
<header class="top"><div class="brand">EPT <span>TASKS</span></div><button class="btn-out" id="btnSair" type="button">Sair da conta</button></header>
<main class="wrap"><section class="intro"><div class="muted">Área do aluno</div><h1>Olá, <span id="nomeAluno">Aluno</span>!</h1><p class="muted">Aqui estão as atividades que seus professores enviaram para você.</p></section>
<section class="summary"><span class="muted">Atividades pendentes</span><strong id="contador">—</strong></section>
<section class="panel"><h2>Minhas atividades</h2><div id="lista" class="loading">Carregando suas atividades...</div></section></main>
<script>
const API='http://localhost:3000',token=localStorage.getItem('token'),tipo=localStorage.getItem('tipo'),nome=localStorage.getItem('nome')||'Aluno';const $=id=>document.getElementById(id);
if(!token||tipo!=='aluno'){localStorage.removeItem('token');window.location.replace('login.html');}
$('nomeAluno').textContent=nome;
function sair(){['token','nome','tipo'].forEach(k=>localStorage.removeItem(k));window.location.href='login.html';}$('btnSair').addEventListener('click',sair);
async function api(url,options={}){const r=await fetch(API+url,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});const d=await r.json().catch(()=>({}));if(r.status===401){sair();throw new Error('Sessão expirada.');}if(!r.ok)throw new Error(d.erro||'Erro ao acessar o servidor.');return d;}
function br(v){if(!v)return 'Sem prazo definido';const p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;}
async function carregar(){const lista=$('lista');lista.className='loading';lista.textContent='Carregando suas atividades...';try{const itens=await api('/minhas-atividades');$('contador').textContent=itens.filter(x=>x.status==='Pendente').length;if(!itens.length){lista.className='empty';lista.textContent='Você ainda não recebeu atividades.';return;}lista.className='';lista.innerHTML='';itens.forEach(item=>{const card=document.createElement('article');card.className='task';const head=document.createElement('div');head.className='task-head';const info=document.createElement('div');const h=document.createElement('h3');h.textContent=item.atividade;const professor=document.createElement('div');professor.className='meta';professor.textContent='Professor: '+(item.professor||'Não informado');info.append(h,professor);const badge=document.createElement('span');badge.className='pill'+(item.status==='Concluída'?' done':'');badge.textContent=item.status;head.append(info,badge);card.append(head);if(item.descricao){const p=document.createElement('p');p.textContent=item.descricao;card.append(p);}const prazo=document.createElement('div');prazo.className='meta';prazo.textContent='Prazo de entrega: '+br(item.prazo);card.append(prazo);if(item.status==='Pendente'){const b=document.createElement('button');b.className='btn-done';b.textContent='Marcar como concluída';b.addEventListener('click',async()=>{b.disabled=true;try{await api('/atividades/'+item.id+'/concluir',{method:'PATCH'});await carregar();}catch(e){alert(e.message);b.disabled=false;}});card.append(b);}lista.append(card);});}catch(e){lista.className='error';lista.textContent=e.message;}}
carregar();
</script></body></html>
